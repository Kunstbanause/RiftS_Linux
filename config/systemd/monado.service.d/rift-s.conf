# Written by rift-s-linux setup. Values you change here (or in the GUI) are kept on re-runs.
[Service]
# Monado can hang on stop after losing the headset (unplug): give up after 10 s, not 45 s
TimeoutStopSec=10
# Fedora's basalt-monado only ships the versioned .so (the unversioned symlink is in -devel)
Environment="VIT_SYSTEM_LIBRARY_PATH=/usr/lib64/libbasalt.so.2"
# Mercury hand tracking needs ONNX models that are not packaged; enabling it crashes the service
Environment="RIFT_S_HANDTRACKING=0"
# Render at the panel's native resolution instead of Monado's default 140 % (good for iGPUs;
# a strong dedicated GPU can go back to 140)
Environment="XRT_COMPOSITOR_SCALE_PERCENTAGE=100"
# Head tracking cameras fed to SLAM (2 = front pair only saves ~0.8 cores but stutters on head turns)
Environment="RIFT_S_SLAM_CAMS=5"
# Rift S lens model (patch 0007)
Environment="RIFT_S_DISTORTION_C1=0.47"
# Frame pacing: 8 ms compositor budget per frame (the default 3 ms missed about half the vblanks
# on an AMD iGPU -> judder on head turns)
Environment="U_PACING_COMP_MIN_TIME_MS=8"
